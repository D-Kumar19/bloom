name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, for example v0.1.0 or v0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_HOST: github.com
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and exact-commit CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Draft releases must run from main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Invalid version; use vMAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N]."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::Tag already exists; choose a new version."
            exit 1
          fi
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$VERSION" "$RUNNER_TEMP/release-tags"; then
            echo "::error::Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh run list --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --limit 100 --json status,conclusion \
            --jq 'any(.[]; .status == "completed" and .conclusion == "success")' > "$RUNNER_TEMP/ci-passed"
          if ! grep -Fxq true "$RUNNER_TEMP/ci-passed"; then
            echo "::error::This exact main commit needs a successful push CI run, including the Docker build."
            exit 1
          fi

      - name: Create draft with generated release notes
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$VERSION" --draft --target "$GITHUB_SHA"
            --title "Bloom $VERSION" --generate-notes
            --notes "Source milestone for commit $GITHUB_SHA. This release does not deploy Bloom to Vercel or certify production acceptance checks. Review the generated notes and docs/backlog.md before publishing."
          )
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: Verify draft and target
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$VERSION" --json isDraft,targetCommitish,tagName,url > "$RUNNER_TEMP/draft.json"
          jq -e --arg version "$VERSION" --arg sha "$GITHUB_SHA" \
            '.isDraft == true and .tagName == $version and .targetCommitish == $sha' \
            "$RUNNER_TEMP/draft.json"
          {
            echo "## Verified draft: $VERSION"
            echo "Commit: $GITHUB_SHA"
            jq -r '"Review draft: " + .url' "$RUNNER_TEMP/draft.json"
            echo "CI passed for this exact commit. Review release notes and production acceptance checks before publication."
            echo "Nothing was published or deployed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
